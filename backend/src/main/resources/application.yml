spring:
  application:
    name: flowops-api

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:google-client-id-placeholder}
            client-secret: ${GOOGLE_CLIENT_SECRET:google-client-secret-placeholder}
            scope:
              - openid
              - profile
              - email
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
          github:
            client-id: ${GITHUB_CLIENT_ID:github-client-id-placeholder}
            client-secret: ${GITHUB_CLIENT_SECRET:github-client-secret-placeholder}
            scope:
              - read:user
              - user:email
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"

  jackson:
    serialization:
      # Instant -> "2026-08-24T10:15:30.123Z", never a numeric epoch. The shared
      # TypeScript types declare every timestamp as an ISO-8601 string.
      write-dates-as-timestamps: false
    deserialization:
      # Security control, not a nicety: a body smuggling "role" or
      # "organizationId" gets 400 MALFORMED_REQUEST instead of a silent ignore.
      fail-on-unknown-properties: true

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/flowops}
    username: ${SPRING_DATASOURCE_USERNAME:flowops}
    password: ${SPRING_DATASOURCE_PASSWORD:flowops}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms

  jpa:
    hibernate:
      ddl-auto: validate      # Flyway owns the schema
    open-in-view: false

  flyway:
    enabled: true
    schemas: public
    default-schema: public

server:
  port: ${BACKEND_PORT:8080}
  error:
    whitelabel:
      # The default Spring Boot error body must never reach the client; every
      # error goes through GlobalExceptionHandler's envelope.
      enabled: false

flowops:
  ratelimit:
    enabled: ${FLOWOPS_RATELIMIT_ENABLED:true}
    fail-closed-for-security: ${FLOWOPS_RATELIMIT_FAIL_CLOSED_FOR_SECURITY:true}

  cors:
    # Comma-separated list of allowed frontend origins
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}

  auth:
    # Required. Empty default so startup fails with an actionable message from
    # AuthProperties rather than an opaque placeholder-resolution error.
    jwt-secret: ${JWT_SECRET:}
    issuer: flowops
    audience: flowops-api
    access-token-ttl: 15m
    refresh-token-ttl: 7d
    reset-token-ttl: 1h
    bcrypt-strength: 12
    refresh-cookie:
      name: flowops_refresh
      path: /api/auth
      secure: ${REFRESH_COOKIE_SECURE:false}      # true in every non-local environment
      same-site: ${REFRESH_COOKIE_SAME_SITE:Lax}  # None in production

  mail:
    # Operator-level SMTP relay for the password-reset mailer. Independent of the
    # per-organization EMAIL *integration*, whose relay is configured by customers
    # at runtime and stored encrypted. Leave SMTP_HOST empty to disable reset mail:
    # forgot-password still returns 204 and still stores its token, but nothing is
    # delivered. SMTP_PASSWORD is a secret and is never logged.
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    encryption: ${SMTP_ENCRYPTION:STARTTLS}
    from-address: ${SMTP_FROM_ADDRESS:}
    from-name: ${SMTP_FROM_NAME:Vantis}
    # Frontend origin used to compose the reset link ({origin}/reset-password?token=…).
    # This is the *frontend* origin, not the backend PUBLIC_BASE_URL (webhook URLs).
    app-base-url: ${FRONTEND_PUBLIC_URL:http://localhost:3000}

  execution:
    # In-process engine defaults. Redis-backed queueing is opt-in and wired later;
    # the in-memory queue below runs the full spine with no external dependency.
    worker-pool-size: ${EXECUTION_WORKERS:4}
    max-attempts: 3            # per-node attempts before an honest failure
    retry-backoff: 2s          # exponential: 2s, 4s, 8s, ... capped below
    max-retry-backoff: 30s
    max-delay-seconds: 300     # a Delay node never parks a worker longer than this
    http-connect-timeout: 5s
    http-request-timeout: 30s
    http-max-body-bytes: 1048576   # 1 MiB captured response body, then truncated
    sse-timeout: 30m

  ai:
    # Backend → Python AI service. The browser never talks to the AI service; the
    # backend brokers every call and presents `token` in the X-Service-Token header.
    # The provider key lives only on the AI service and is never sent here.
    base-url: ${AI_SERVICE_URL:http://localhost:8100}
    token: ${AI_SERVICE_TOKEN:}
    connect-timeout: 5s
    request-timeout: 120s          # agent runs may take several provider round-trips

  crypto:
    # Base64-encoded 32-byte (256-bit) AES key for encrypting integration
    # credentials at rest (AES-256-GCM). Required once integrations are used;
    # CryptoProperties fails fast at startup if it is missing or the wrong length.
    # Never commit a real key — this env var is supplied per environment.
    encryption-key: ${ENCRYPTION_KEY:}

  webhook:
    # Externally-reachable backend origin, used only to compose the absolute inbound
    # webhook URL handed back once at generate time. No secret; safe to log.
    public-base-url: ${PUBLIC_BASE_URL:http://localhost:8080}

  reliability:
    # Reliability/observability layer thresholds. Conservative by design — they
    # exist to avoid false positives. Baselines are unusable below min-sample-count,
    # detection is suppressed until warmup-period of history exists, and sensitivity
    # is how many MADs from the median count as anomalous (higher = fewer alerts).
    baseline-window: ${RELIABILITY_BASELINE_WINDOW:24h}
    scheduler-delay: 5m             # how often the volume + baseline sweep runs
    min-sample-count: 5            # observations before a baseline is trusted
    warmup-period: 1h               # min history age before detection runs
    sensitivity: 2.5                # MAD multiplier for latency/output-size thresholds
    volume-z-threshold: 3.0         # robust-z threshold for a volume anomaly
    volume-ratio-floor: 1.5         # min current/baseline count ratio before a volume alert
    cooldown: 15m                   # dedup window for a repeated anomaly key
    null-rate-spike: 0.15           # absolute null-rate jump that flags an output field
    min-confidence: 0.2             # findings below this confidence are suppressed
    volume-drop-window: 30m         # wider window for detecting a volume collapse

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
  health:
    redis:
      enabled: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    root: INFO
    # DEBUG here must never be used to log request bodies for /api/auth/* —
    # passwords and tokens are never logged at any level (contract §9).
    com.flowops: DEBUG
