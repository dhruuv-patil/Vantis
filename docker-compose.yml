# Vantis — full local stack.
#
# Docker is OPTIONAL. The default local workflow runs each service on the host
# (see README). Compose is provided for a one-command full stack:
#
#   cp .env.example .env
#   docker compose up -d --build
#
# Services: postgres, redis, ai-service (Python), backend (Spring Boot), frontend (Next.js).

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: vantis-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-flowops}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend-tier
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-flowops}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    security_opt:
      - "no-new-privileges:true"

  # Redis is used for distributed rate limiting across backend instances
  # and for execution queueing.
  redis:
    image: redis:7-alpine
    container_name: vantis-redis
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - backend-tier
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    security_opt:
      - "no-new-privileges:true"

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: vantis-ai
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      AI_PROVIDER: ${AI_PROVIDER:-omniroute}
      OMNIROUTE_BASE_URL: ${OMNIROUTE_BASE_URL:-http://host.docker.internal:20128/v1}
      OMNIROUTE_MODEL: ${OMNIROUTE_MODEL:-auto/best-chat}
      OMNIROUTE_API_KEY: ${OMNIROUTE_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:?AI_SERVICE_TOKEN is required}
    # The AI service is NOT exposed on the host network. The backend talks to
    # it over the internal network; nothing else should.
    expose:
      - "8100"
    networks:
      - backend-tier
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/health', timeout=2).read()\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    security_opt:
      - "no-new-privileges:true"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vantis-backend
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      BACKEND_PORT: 8080
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://postgres:5432/${POSTGRES_DB:-flowops}}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:?POSTGRES_USER is required}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      AI_SERVICE_URL: http://ai-service:8100
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:?AI_SERVICE_TOKEN is required}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required (comma-separated)}
      # JWT_SECRET and ENCRYPTION_KEY have no defaults: AuthPropertiesValidator
      # and CryptoProperties fail the boot if either is missing or weak.
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required (openssl rand -base64 48)}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY is required (openssl rand -base64 32)}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?PUBLIC_BASE_URL is required (e.g. https://api.vantis.run)}
      REFRESH_COOKIE_SECURE: ${REFRESH_COOKIE_SECURE:-true}
      REFRESH_COOKIE_SAME_SITE: ${REFRESH_COOKIE_SAME_SITE:-None}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      ENTITLEMENTS_ENFORCEMENT: ${ENTITLEMENTS_ENFORCEMENT:-log}
      PRIVATE_BETA: ${PRIVATE_BETA:-true}
      BILLING_ENABLED: ${BILLING_ENABLED:-false}
      BILLING_PROVIDER: ${BILLING_PROVIDER:-noop}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_ENCRYPTION: ${SMTP_ENCRYPTION:-STARTTLS}
      SMTP_FROM_ADDRESS: ${SMTP_FROM_ADDRESS:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Vantis}
      FRONTEND_PUBLIC_URL: ${FRONTEND_PUBLIC_URL:-http://localhost:3000}
    ports:
      - "8080:8080"
    networks:
      - backend-tier
      - frontend-tier
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    security_opt:
      - "no-new-privileges:true"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-Vantis}
    container_name: vantis-frontend
    environment:
      # Browser-exposed. Only ever put non-secret values behind NEXT_PUBLIC_*.
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL is required (e.g. https://api.vantis.run)}
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-Vantis}
    ports:
      - "3000:3000"
    networks:
      - frontend-tier
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    security_opt:
      - "no-new-privileges:true"

networks:
  backend-tier:
    driver: bridge
  frontend-tier:
    driver: bridge

volumes:
  postgres_data:
